services:
  db:
    container_name: corp-db
    image: postgres:16
    environment:
      POSTGRES_DB: "corpdb"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5433:5432"
    volumes:
      - corp-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  corp-pgdata:
